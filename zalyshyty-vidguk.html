    var TURNSTILE_SITE_KEY = '0x4AAAAAAEN_ITiVOYm-fh4I';

    var form = document.getElementById('reviews-form');
    var statusEl = document.getElementById('reviews-status');
    var turnstileEl = document.getElementById('reviews-turnstile');
    var turnstileWidgetId = null;
    var isRu = document.documentElement.lang === 'ru';

    var script = document.createElement('script');
    script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    script.onload = function () {
        turnstileWidgetId = window.turnstile.render(turnstileEl, { sitekey: TURNSTILE_SITE_KEY });
    };
    document.body.appendChild(script);

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var data = new FormData(form);
        var rating = Number(data.get('rating'));
        var turnstileToken = (window.turnstile && turnstileWidgetId !== null)
            ? window.turnstile.getResponse(turnstileWidgetId)
            : '';

        if (!rating) {
            statusEl.textContent = isRu ? 'Выберите оценку от 1 до 5 звёзд.' : 'Оберіть оцінку від 1 до 5 зірок.';
            return;
        }

        statusEl.textContent = isRu ? 'Отправляем…' : 'Надсилаємо…';
        fetch('https://santehnikdpvidguk.pages.dev/api/reviews', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
                name: data.get('name'),
                text: data.get('text'),
                rating: rating,
                website: data.get('website'),
                turnstileToken: turnstileToken
            })
        })
            .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
            .then(function (res) {
                if (res.ok) {
                    statusEl.textContent = res.body.message;
                    form.reset();
                    if (window.turnstile && turnstileWidgetId !== null) { window.turnstile.reset(turnstileWidgetId); }
                } else {
                    statusEl.textContent = res.body.error || (isRu ? 'Что-то пошло не так, попробуйте ещё раз.' : 'Щось пішло не так, спробуйте ще раз.');
                }
            })
            .catch(function () {
                statusEl.textContent = isRu ? 'Что-то пошло не так, попробуйте ещё раз.' : 'Щось пішло не так, спробуйте ще раз.';
            });
    });
})();</script><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p><a href="https://santehnik.dp.ua/" title="Виклик сантехніка у Києві">santehnik.dp.ua</a></p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://santehnik.dp.ua/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://santehnik.dp.ua/assets/js/scripts.min.js?v&#x3D;dafec4f87fead6718cb125f0b0fc8441"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
